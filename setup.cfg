# import-linter reads its config from setup.cfg
[importlinter]
root_package = atom
include_external_packages = True

[importlinter:contract:layers]
name = ATOM layering (MODULE-MAP.md section 1)
type = layers
layers =
    web
    reporting
    orchestration
    strategy
    adapters
    domain
containers =
    atom

[importlinter:contract:adapters-are-isolated]
name = Adapters may not reach persistence, strategy, orchestration or reporting
type = forbidden
source_modules =
    atom.adapters
forbidden_modules =
    atom.persistence
    atom.strategy
    atom.orchestration
    atom.reporting

[importlinter:contract:domain-is-pure]
name = Domain imports nothing else in the project
type = forbidden
source_modules =
    atom.domain
forbidden_modules =
    atom.adapters
    atom.persistence
    atom.strategy
    atom.orchestration
    atom.reporting
    atom.infra
    atom.web

[importlinter:contract:no-sql-outside-persistence]
name = Strategy and domain never import the DB driver
type = forbidden
source_modules =
    atom.strategy
    atom.domain
forbidden_modules =
    psycopg

[importlinter:contract:no-http-outside-adapters]
name = HTTP clients live only in the adapter layer and infra
type = forbidden
source_modules =
    atom.domain
    atom.strategy
    atom.reporting
forbidden_modules =
    httpx
    requests
