[project]
name = "atom"
version = "0.1.0"
description = "Multi-broker mean-reversion ETF trading system for the Indian market"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.1",
    "boto3>=1.34",
    "python-dateutil>=2.9",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.4",
    "import-linter>=2.0",
    "respx>=0.21",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atom*"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["atom", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "RUF"]
ignore = [
    "B008",    # FastAPI Depends() in defaults is idiomatic
    "RUF012",  # ClassVar annotation noise on dataclass defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "N817"]   # `Decimal as D` keeps test tables readable
"atom/cli/**" = ["T20"]     # CLI entry points print

[tool.ruff.lint.isort]
known-first-party = ["atom"]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["id", "type", "format", "hash"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = []

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs a database",
]

[tool.coverage.run]
source = ["atom"]
branch = true
